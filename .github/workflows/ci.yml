name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint 2.x, configured by the version 2 .golangci.yml at the root.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # go.mod is the single source of truth for the Go version we support.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # macOS 26's dyld aborts binaries built by Go older than 1.24 (they lack the
  # LC_UUID load command), which is one of the reasons the module targets a
  # current toolchain instead of the oldest one that would compile.
  test-next:
    name: Test (ubuntu-latest, go stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `check` walks every tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Every tag is documented in CHANGELOG.md
        run: go run ./cmd/feather-release check

      - name: go.mod must not pin a toolchain
        run: |
          if grep -q '^toolchain ' go.mod; then
            echo "go.mod pins a toolchain: run 'go mod edit -toolchain=none'"
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce 80% coverage on internal packages
        run: |
          go test -short -coverprofile=coverage.out -covermode=count ./internal/...
          go tool cover -func=coverage.out | tail -1

          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total coverage: ${total}%"

          if awk -v total="$total" 'BEGIN { exit !(total + 0 < 80) }'; then
            echo "coverage ${total}% is below the 80% floor"
            exit 1
          fi
