name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The module declares `go 1.22.0`, so the lowest toolchain we still
        # support is a 1.22 patch release. It must not be exactly 1.22.0: Go
        # 1.22.0 and 1.22.1 emit macOS arm64 binaries without the LC_UUID load
        # command, and the dyld shipped with macOS 14.4+ kills them with
        # "missing LC_UUID load command" and an abort trap. That bug is fixed in
        # Go 1.22.3, so we test the newest 1.22 patch on all three platforms and
        # the current stable toolchain once on Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22.12"]
        include:
          - os: ubuntu-latest
            go: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check` walks every tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Every tag is documented in CHANGELOG.md
        run: go run ./cmd/feather-release check

      - name: go.mod must not pin a toolchain
        run: |
          if grep -q '^toolchain ' go.mod; then
            echo "go.mod pins a toolchain: run 'go mod edit -toolchain=none'"
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce 80% coverage on internal packages
        run: |
          go test -short -coverprofile=coverage.out -covermode=count ./internal/...
          go tool cover -func=coverage.out | tail -1

          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total coverage: ${total}%"

          if awk -v total="$total" 'BEGIN { exit !(total + 0 < 80) }'; then
            echo "coverage ${total}% is below the 80% floor"
            exit 1
          fi
